name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Rust MSVC toolchain
        shell: pwsh
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Test
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Install compiler SDK for bundled package
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Build packages
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }
          .\package.ps1 -DotnetRoot $env:DOTNET_ROOT -Version $tag

      - name: Validate packages
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          .\tests\test-packages.ps1 -LitePath "dist/unity-roslyn-launcher-$tag-lite.zip" -BundledPath "dist/unity-roslyn-launcher-$tag-bundled.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @("dist/unity-roslyn-launcher-$tag-lite.zip", "dist/unity-roslyn-launcher-$tag-bundled.zip")
          $releaseArgs = @('release', 'create', $tag) + $assets + @('--verify-tag', '--generate-notes', '--title', $tag)
          if ($tag.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
