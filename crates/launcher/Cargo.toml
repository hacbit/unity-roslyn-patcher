[package]
name = "unity-roslyn-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unity-launcher"
path = "src/main.rs"

[[bin]]
name = "compiler-proxy"
path = "src/proxy.rs"

[[bin]]
name = "chain-probe"
path = "src/probe.rs"

[dependencies]
launcher-core = { path = "../core" }
launcher-detours = { path = "../detours" }
serde_json.workspace = true
sha2.workspace = true
windows-sys.workspace = true
