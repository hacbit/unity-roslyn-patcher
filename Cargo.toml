[workspace]
members = ["crates/core", "crates/detours", "crates/hook", "crates/launcher"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = "thin"
